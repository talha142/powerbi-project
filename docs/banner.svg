<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Power BI Dashboards: Interactive analytics: cricket, bank loans and collections">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1a05"/>
      <stop offset="1" stop-color="#5c4a00"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
    <path d="M200 0V300M400 0V300M600 0V300M800 0V300M1000 0V300"/>
  </g>
  <g fill="#f2c811" opacity="0.9">
    <rect x="1040" y="70" width="26" height="60" rx="4"/><rect x="1076" y="45" width="26" height="85" rx="4"/><rect x="1112" y="20" width="26" height="110" rx="4"/>
  </g>
  <text x="60" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Power BI Dashboards</text>
  <text x="62" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#ffe27a">Interactive analytics: cricket, bank loans and collections</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle">
    <rect x="120" y="190" width="210" height="56" rx="28" fill="url(#chip)" stroke="#f2c811" stroke-opacity="0.7"/>
    <text x="225" y="225">PSL Cricket</text>
    <rect x="370" y="190" width="210" height="56" rx="28" fill="url(#chip)" stroke="#f2c811" stroke-opacity="0.7"/>
    <text x="475" y="225">Bank Loans</text>
    <rect x="620" y="190" width="210" height="56" rx="28" fill="url(#chip)" stroke="#f2c811" stroke-opacity="0.7"/>
    <text x="725" y="225">Collections</text>
    <rect x="870" y="190" width="210" height="56" rx="28" fill="url(#chip)" stroke="#f2c811" stroke-opacity="0.7"/>
    <text x="975" y="225">Customer Trends</text>
  </g>
